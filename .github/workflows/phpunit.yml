name: PHPUnit

on:
  pull_request: ~
  push:
    branches: [ 4.x ]

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - laravel: 12.*
            php: 8.2
          - laravel: 12.*
            php: 8.3
          - laravel: 12.*
            php: 8.4
          - laravel: 12.*
            php: 8.5
          - laravel: 13.*
            php: 8.3
          - laravel: 13.*
            php: 8.4
          - laravel: 13.*
            php: 8.5
            coverage: xdebug
          - laravel: 13.*
            php: '8.6'
    name: Tests on Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: ${{ matrix.coverage || 'none' }}

      - name: Install dependencies
        env:
          COMPOSER_POLICY_ADVISORIES_BLOCK: 0
          COMPOSER_POLICY_ABANDONED_BLOCK: 0
        run: |
          composer require laravel/framework:"${{ matrix.laravel }}" --dev --no-update
          composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests
        if: ${{ !matrix.coverage }}
        run: vendor/bin/phpunit

      - name: Run tests with coverage
        if: ${{ matrix.coverage }}
        run: vendor/bin/phpunit --coverage-clover coverage.xml

      - name: Upload coverage to Codecov
        if: ${{ matrix.coverage }}
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
