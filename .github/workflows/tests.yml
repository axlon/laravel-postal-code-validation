name: tests

on:
  pull_request: ~
  push:
    branches: [ 4.x ]

jobs:
  laravel:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - laravel: 12.*
            php: 8.2
          - laravel: 12.*
            php: 8.3
          - laravel: 12.*
            php: 8.4
          - laravel: 12.*
            php: 8.5
          - laravel: 13.*
            php: 8.3
          - laravel: 13.*
            php: 8.4
          - laravel: 13.*
            php: 8.5
          - laravel: 13.*
            php: '8.6'
    name: PHPUnit on Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@2.40.0
        with:
          php-version: ${{ matrix.php }}

      - name: Install dependencies
        env:
          COMPOSER_POLICY_ADVISORIES_BLOCK: 0
          COMPOSER_POLICY_ABANDONED_BLOCK: 0
        run: |
          composer require laravel/framework:"${{ matrix.laravel }}" --dev --no-update
          composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
